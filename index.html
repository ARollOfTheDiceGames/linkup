

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINKUP — Daily Word Game</title>
<link rel="icon" type="image/png" href="./images (1).png">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f8f8f5;
  color: #20221f;
  font-family: "Helvetica", sans-serif;
  min-height: 100vh;
}

header {
  height: 66px;
  border-bottom: 1px solid #deded8;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 3px;
}

.header-label {
  font-size: 12px;
  color: #777;
  letter-spacing: 1px;
}

main {
  width: 100%;
  max-width: 480px;
  margin: 45px auto;
  padding: 0 20px;
  text-align: center;
}

h1 {
  font-size: 34px;
  margin: 0 0 8px;
  letter-spacing: -1px;
}

.subtitle {
  color: #777;
  font-size: 14px;
  margin-bottom: 30px;
}

.instructions {
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 25px;
}

.clues {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 25px;
}

.clue {
  background: white;
  border: 1px solid #deded8;
  border-radius: 10px;
  padding: 22px 10px;
  font-size: 19px;
  font-weight: 700;
  transition: .2s;
}

.clue:last-child {
  grid-column: span 2;
}

.clue:hover {
  border-color: #779b83;
}

.input-area {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
  background: white;
}

input:focus {
  border-color: #548665;
}

input:disabled {
  background: #eee;
}

button {
  border: none;
  border-radius: 8px;
  padding: 0 20px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.submit {
  background: #243e30;
  color: white;
}

.submit:hover:not(:disabled) {
  background: #365b45;
}

.hint-btn {
  background: transparent;
  border: 1px solid #ccc;
  padding: 12px 18px;
  margin-top: 12px;
  color: #555;
}

.hint-btn:hover:not(:disabled) {
  border-color: #548665;
}

.attempts {
  margin: 22px 0;
  display: flex;
  justify-content: center;
  gap: 9px;
}

.dot {
  height: 10px;
  width: 10px;
  border-radius: 50%;
  background: #deded8;
}

.dot.used {
  background: #426b50;
}

.message {
  min-height: 25px;
  font-size: 14px;
  margin-top: 12px;
  font-weight: 600;
}

.hint {
  font-size: 13px;
  color: #777;
  min-height: 20px;
  margin-top: 8px;
  line-height: 1.5;
}

.result {
  display: none;
  margin-top: 25px;
  padding: 22px;
  background: white;
  border: 1px solid #deded8;
  border-radius: 12px;
}

.result h2 {
  margin-top: 0;
}

.answer {
  font-size: 25px;
  font-weight: 900;
  margin: 12px 0;
  color: #365b45;
}

.explanation {
  font-size: 14px;
  color: #666;
  line-height: 1.6;
}

.difficulty {
  color: #888;
  font-size: 11px;
  letter-spacing: 1px;
  margin-top: 8px;
  text-transform: uppercase;
}

.share {
  background: #243e30;
  color: white;
  padding: 13px 20px;
  margin-top: 12px;
  width: 100%;
}

footer {
  color: #999;
  font-size: 12px;
  margin-top: 45px;
  text-align: center;
}

@media(max-width: 400px) {
  h1 {
    font-size: 29px;
  }

  header {
    padding: 0 14px;
  }

  .header-label {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">LINKUP.</div>
  <div class="header-label">LOADING PUZZLE...</div>
</header>

<main>

  <h1>Make the connection.</h1>

  <div class="subtitle">
    One word. Five connections. Six guesses.
  </div>

  <div class="instructions">
    Find the ONE word that can connect with all five words below.
    Think of common phrases and combinations.
  </div>

  <div class="clues" id="clues">
    <div class="clue">...</div>
    <div class="clue">...</div>
    <div class="clue">...</div>
    <div class="clue">...</div>
    <div class="clue">...</div>
  </div>

  <div class="input-area">
    <input
      id="guess"
      placeholder="Enter your guess..."
      autocomplete="off"
      disabled
    >

    <button
      class="submit"
      id="submitButton"
      onclick="submitGuess()"
      disabled
    >
      GUESS
    </button>
  </div>

  <button
    class="hint-btn"
    id="hintButton"
    onclick="showHint()"
    disabled
  >
    Need a hint?
  </button>

  <div class="hint" id="hint"></div>

  <div class="attempts" id="attempts">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="message" id="message">
    Loading today's puzzle...
  </div>

  <div class="result" id="result">

    <h2 id="result-title"></h2>

    <div class="answer" id="result-answer"></div>

    <div class="difficulty" id="result-difficulty"></div>

    <p id="result-text"></p>

    <p class="explanation" id="explanation"></p>

    <div id="result-grid"></div>

    <button class="share" onclick="shareResult()">
      SHARE RESULT
    </button>

  </div>

  <footer>
    ONE PUZZLE EVERY DAY AT 12 PM EST. COME BACK TOMORROW.
  </footer>

</main>

<script>

// =====================================
// GAME VARIABLES
// =====================================

let currentPuzzle = null;

let attempts = 0;
let hintsUsed = 0;
let finished = false;

let results = [];

const MAX_ATTEMPTS = 6;


// =====================================
// LOAD TODAY'S PUZZLE FROM JSON
// =====================================

async function loadPuzzle() {

  const message = document.getElementById("message");

  const input = document.getElementById("guess");
  const submitButton = document.getElementById("submitButton");
  const hintButton = document.getElementById("hintButton");

  try {

    message.textContent = "Loading today's puzzle...";

    const response = await fetch("./data/puzzles.json");

    if (!response.ok) {
      throw new Error("Could not load puzzles.json");
    }

    const puzzles = await response.json();

    // Get today's date using Eastern Time

    const today = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/New_York",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());

    // Find today's puzzle

    currentPuzzle = puzzles.find(
      puzzle => puzzle.date === today
    );

    // Check if a puzzle exists

    if (!currentPuzzle) {

      message.textContent =
        "No puzzle available today. Check back tomorrow!";

      return;
    }

    // Check database entry

    if (
      !Array.isArray(currentPuzzle.clues) ||
      currentPuzzle.clues.length !== 5 ||
      !currentPuzzle.answer ||
      !Array.isArray(currentPuzzle.hints)
    ) {
      throw new Error("Today's puzzle has missing or invalid data.");
    }

    // Display clues

    document.getElementById("clues").innerHTML =
      currentPuzzle.clues.map(word =>
        `<div class="clue"></div>`
      ).join("");

    // Safely insert clue text

    document.querySelectorAll(".clue").forEach((element, index) => {
      element.textContent = currentPuzzle.clues[index];
    });

    // Update puzzle number

    document.querySelector(".header-label").textContent =
      "DAILY PUZZLE #" +
      String(currentPuzzle.id).padStart(3, "0");

    // Enable game

    input.disabled = false;
    submitButton.disabled = false;
    hintButton.disabled = false;

    message.textContent = "You have 6 attempts remaining.";

  } catch (error) {

    console.error("Puzzle loading error:", error);

    message.textContent =
      "Couldn't load today's puzzle. Please try again later.";

  }

}


// =====================================
// HINT SYSTEM
// =====================================

function showHint() {

  if (finished || !currentPuzzle) return;

  const hintBox = document.getElementById("hint");

  if (hintsUsed < currentPuzzle.hints.length) {

    hintBox.textContent =
      "💡 " + currentPuzzle.hints[hintsUsed];

    hintsUsed++;

  } else {

    hintBox.textContent = "No more hints available!";

  }

}


// =====================================
// CHECK PLAYER'S GUESS
// =====================================

function submitGuess() {

  if (finished || !currentPuzzle) return;

  const input = document.getElementById("guess");

  const guess = input.value.trim().toUpperCase();

  if (!guess) return;

  // Get accepted answers

  const acceptedAnswers =
    currentPuzzle.acceptedAnswers || [currentPuzzle.answer];

  // Check answer without worrying about capitalization

  const correct = acceptedAnswers.some(answer =>
    answer.trim().toUpperCase() === guess
  );

  attempts++;

  results.push(correct ? "🟩" : "⬜");

  // Update attempt indicators

  const dots = document.querySelectorAll(".dot");

  dots[attempts - 1].classList.add("used");

  if (correct) {

    finish(true);

  } else if (attempts >= MAX_ATTEMPTS) {

    finish(false);

  } else {

    document.getElementById("message").textContent =
      "Not quite! " + (MAX_ATTEMPTS - attempts) +
      " attempts remaining.";

  }

  input.value = "";

  if (!finished) input.focus();

}


// =====================================
// FINISH THE GAME
// =====================================

function finish(won) {

  finished = true;

  const result = document.getElementById("result");

  result.style.display = "block";

  document.getElementById("result-title").textContent =
    won ? "🎉 You got it!" : "Better luck tomorrow!";

  document.getElementById("result-answer").textContent =
    currentPuzzle.answer;

  document.getElementById("result-text").textContent =
    won
      ? "You solved Linkup in " + attempts + " attempt(s)!"
      : "The answer was " + currentPuzzle.answer + ".";

  document.getElementById("result-difficulty").textContent =
    currentPuzzle.difficulty
      ? "DIFFICULTY: " + currentPuzzle.difficulty
      : "";

  document.getElementById("explanation").textContent =
    currentPuzzle.explanation || "";

  // Fill remaining boxes if player loses

  if (!won) {

    while (results.length < MAX_ATTEMPTS) {
      results.push("⬜");
    }

  }

  document.getElementById("result-grid").textContent =
    results.join(" ");

  document.getElementById("message").textContent =
    won ? "Connection found!" : "Puzzle completed.";

  // Disable controls

  document.getElementById("guess").disabled = true;

  document.getElementById("submitButton").disabled = true;

  document.getElementById("hintButton").disabled = true;

}


// =====================================
// ENTER KEY SUPPORT
// =====================================

document.getElementById("guess").addEventListener("keydown", event => {

  if (event.key === "Enter") {
    submitGuess();
  }

});


// =====================================
// SHARE RESULTS
// =====================================

async function shareResult() {

  if (!currentPuzzle) return;

  const won = results.includes("🟩");

  const score = won
    ? attempts + "/6"
    : "X/6";

  const text =
    "LINKUP #" +
    String(currentPuzzle.id).padStart(3, "0") +
    "\n\n" +
    results.join("") +
    "\n" +
    score +
    "\n\n" +
    "Play Linkup!";

  try {

    if (navigator.share) {

      await navigator.share({
        title: "LINKUP",
        text: text
      });

    } else {

      await navigator.clipboard.writeText(text);

      alert("Results copied to clipboard!");

    }

  } catch (error) {

    if (error.name !== "AbortError") {
      console.error("Sharing failed:", error);
    }

  }

}


// =====================================
// START GAME
// =====================================

loadPuzzle();

</script>

</body>
</html>
